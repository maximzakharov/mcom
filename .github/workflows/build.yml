name: build

# Called by ci.yml and release.yml so both run the exact same build.
on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo test --locked

  build:
    needs: test
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
    steps:
      - uses: actions/checkout@v5

      # Prebuilt cross binary; it builds the musl targets in Docker so no
      # cross-linker has to be installed on the runner.
      - name: Install cross
        if: matrix.cross
        run: |
          curl -fsSL https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-gnu.tar.gz \
            | sudo tar xz -C /usr/local/bin cross

      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package
        run: tar -C target/${{ matrix.target }}/release -czf mcom-${{ matrix.target }}.tar.gz mcom

      - uses: actions/upload-artifact@v4
        with:
          name: mcom-${{ matrix.target }}
          path: mcom-${{ matrix.target }}.tar.gz
